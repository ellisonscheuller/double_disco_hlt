# collide-1m-ptrawv1.0 four-top signal (tttt_incl) ONLY, eval-only -- same
# sample_dir/schema/n_objects as data_collide2v_ptrawv1_std4.yaml (must match
# so the trained encoder's token count lines up). No split/store_by_class and
# a single listed class -> assemble_and_save's "all classes mixed in one
# file" branch degenerates to a clean single-sample file here, same
# convention as data_collide2v_signal_tttt.yaml's older /collide/collide-1m
# signal conversion.
ds_name: collide2v_ptrawv1_std4_tttt_signal

data_processing:
  sample_dir: /collide2vsubset/collide-1m-ptrawv1.0
  out_path: /collide2vsubset/escheuller/collide2v_ptrawv1_std4

  candidate_schema: regionized

  pfcands: true
  n_objects: 512
  sort_by_pt: true
  sk_spacing: null

  also_save_objects: true

  nevents_per_class: -1

  samples:
    - tttt:
      - "tttt_incl/*.parquet"
