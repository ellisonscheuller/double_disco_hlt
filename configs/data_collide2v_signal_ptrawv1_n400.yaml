# collide-1m-ptrawv1.0 signal samples, eval-only -- same sample_dir/schema as
# data_collide2v_signal_ptrawv1.yaml, but n_objects=400 (not 512) to match
# data_collide2v_ptrawv1_n400.yaml's own token count -- signal-only: ttH_incl,
# HH_bbgammagamma, tttt_incl. No split/store_by_class -- signal-only, single
# output file. Own ds_name/out_path so this doesn't collide with the
# existing 512-object signal tensors.
ds_name: collide2v_signal_ptrawv1_n400

data_processing:
  sample_dir: /collide2vsubset/collide-1m-ptrawv1.0
  out_path: /collide2vsubset/escheuller/collide2v_signal_ptrawv1_n400

  candidate_schema: regionized

  # --- PF candidates view (contrastive/NuRD input) ---
  pfcands: true
  n_objects: 400
  sort_by_pt: true
  sk_spacing: null

  # --- AE object view (AE input) ---
  also_save_objects: true

  # take every available event per signal process
  nevents_per_class: -1

  samples:
    - ttH:
      - "ttH_incl/*.parquet"
    - HHbbgg:
      - "HH_bbgammagamma/*.parquet"
    - tttt:
      - "tttt_incl/*.parquet"
