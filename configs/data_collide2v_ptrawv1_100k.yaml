# collide-1m-ptrawv1.0, 100k-event subset -- same source/schema as
# data_collide2v_ptrawv1.yaml (see that file's own header for the full
# provenance), just capped to 25k events/class (DY/QCD/TT/WJet) instead of
# nevents_per_class: -1 (all ~1m), for a faster A100 smoke run. ds_name/
# out_path suffixed _100k so this doesn't collide with the full-dataset
# tensors already on the PVC.
ds_name: collide2v_ptrawv1_0_100k

data_processing:
  sample_dir: /collide2vsubset/collide-1m-ptrawv1.0
  out_path: /collide2vsubset/escheuller/collide2v_ptrawv1_0_100k_tensors
  candidate_schema: regionized

  # --- PF candidates view (contrastive/NuRD input) ---
  pfcands: true
  n_objects: 512
  sort_by_pt: true
  sk_spacing: null

  # --- AE object view (AE input, both trainings share this frozen axis) ---
  also_save_objects: true

  # 25k/class * 4 classes (DY/QCD/TT/WJet) = 100k events total.
  nevents_per_class: 25000

  # --- outputs: one shuffled train/test pair, mixed classes ---
  split: 0.8
  store_by_class: false

  samples:
    - DY:
      - "DYJetsToLL_13TeV-madgraphMLM-pythia8/*.parquet"
    - QCD:
      - "QCD_HT50toInf/*.parquet"
    - TT:
      - "tt0123j_5f_ckm_LO_MLM_leptonic/*.parquet"
      - "tt0123j_5f_ckm_LO_MLM_hadronic/*.parquet"
      - "tt0123j_5f_ckm_LO_MLM_semiLeptonic/*.parquet"
    - WJet:
      - "WJetsToLNu_13TeV-madgraphMLM-pythia8/*.parquet"
