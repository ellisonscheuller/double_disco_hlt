apiVersion: batch/v1
kind: Job
metadata:
  name: train-double-disco-collide2v-test-smcocktail
  namespace: aida-scout
spec:
  backoffLimit: 0                         # don't auto-retry on failure
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
      containers:
        - name: train
          image: pytorch/pytorch:2.3.1-cuda12.1-cudnn8-runtime
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "=== Job started: $(date) ==="
              echo "Host: $(hostname)"

              python -c "import torch; print('CUDA:', torch.cuda.is_available(), '| Device:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU')"

              # numpy/scipy/sklearn/matplotlib/wandb/pyyaml aren't in the base image - the dev
              # pod's ephemeral /opt/conda install of these doesn't survive a pod restart (only
              # the /collide PVC is persistent), so install them fresh every job run instead.
              pip install --quiet numpy scipy scikit-learn matplotlib wandb pyyaml

              cd /collide/escheuller/double_disco
              export PYTHONPATH=src

              python train_pca_per_batch.py \
                --train_cfg configs/train_best_config_yet.yaml \
                --data_cfg  configs/data_collide2v_test.yaml \
                --data      data/collide2v_test/collide2v_test_smcocktail_train.pt

              echo "=== Job finished: $(date) ==="

          env:
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-secret       # create with: kubectl create secret generic wandb-secret --from-literal=WANDB_API_KEY=<key> -n aida-scout
                  key: WANDB_API_KEY

          resources:
            requests:
              memory: "64Gi"
              cpu: "8"
              nvidia.com/a100: "1"
            limits:
              memory: "128Gi"
              cpu: "16"
              nvidia.com/a100: "1"

          volumeMounts:
            - name: collide
              mountPath: /collide

      volumes:
        - name: collide
          persistentVolumeClaim:
            claimName: collide-1m
