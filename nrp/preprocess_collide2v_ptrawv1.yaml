apiVersion: batch/v1
kind: Job
metadata:
  name: preprocess-collide2v-ptrawv1
  namespace: aida-scout   # same namespace as the collide2vsubset PVC, so this job can mount it directly
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: preprocess
          # Reusing the same base image as this repo's other NRP jobs (converterCollide.py
          # imports torch even though this script itself is CPU-only -- no GPU requested below).
          image: pytorch/pytorch:2.3.1-cuda12.1-cudnn8-runtime
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "=== Job started: $(date) ==="

              which git > /dev/null || (apt-get update -qq && apt-get install -y -qq git)

              # awkward/uproot/wandb/pyarrow/pyyaml aren't in the base image -- install fresh
              # every job run (matches preprocess_collide2v_test_smcocktail.yaml's own note).
              pip install --quiet awkward uproot wandb pyarrow pyyaml

              cd /tmp
              git clone --quiet https://github.com/disco-analysis/double_disco_hlt.git
              cd double_disco_hlt
              export PYTHONPATH=src
              export WANDB_MODE=disabled

              # collide-1m-ptrawv1.0 (melissa's fixed-sampling background subset) ->
              # {'pf','label','obj'} .pt train/test split, "regionized" candidate schema
              # (see converterCollide.py's COLLIDE2V_SCHEMAS / this config's own header
              # comment for why -- this dataset has no L1T_PFCand collection at all, and
              # every L1T_* collection is a nested struct column, not flat).
              python converterCollide.py --config configs/data_collide2v_ptrawv1.yaml --overwrite

              echo "=== Output summary ==="
              du -sh /collide2vsubset/escheuller/collide2v_ptrawv1_0_tensors/*
              echo "=== Job finished: $(date) ==="
          resources:
            # 192Gi/256Gi matches preprocess_collide2v_test_smcocktail.yaml's own sizing for
            # this same converter -- QCD's raw-pT candidate multiplicity (~500/event) is what
            # drove that number, and this dataset uses the same raw-pT candidate selection.
            requests:
              memory: "192Gi"
              cpu: "8"
            limits:
              memory: "256Gi"
              cpu: "16"
          volumeMounts:
            - name: collide2vsubset
              mountPath: /collide2vsubset
      volumes:
        - name: collide2vsubset
          persistentVolumeClaim:
            claimName: collide2vsubset
